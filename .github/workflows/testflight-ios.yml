name: TestFlight iOS

# Arquiva o app do iOS, assina para a App Store e manda ao TestFlight (xcodebuild + xcrun altool). Só à mão
# (Actions › TestFlight iOS › Run workflow): o runner de macOS custa 10× o do Ubuntu. Enquanto a conta da Apple
# Developer não existe, o job para no primeiro passo com a lista do que falta (docs/lojas.md, seção iOS); o build sem
# assinatura continua provado pelo job ios do ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-ios
  cancel-in-progress: false

env:
  NODE_VERSION: '26'

jobs:
  testflight:
    name: archive e envio ao testflight
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
    steps:
      - name: confere secrets e variáveis
        env:
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_ASC_KEY_P8_BASE64: ${{ secrets.APPLE_ASC_KEY_P8_BASE64 }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID APPLE_DIST_CERT_P12_BASE64 APPLE_DIST_CERT_PASSWORD APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID APPLE_ASC_KEY_P8_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Conta da Apple ainda não ligada::Faltam os secrets ${missing[*]}. Eles saem da conta Apple Developer (time, certificado de distribuição e chave da API do App Store Connect): o passo a passo está em docs/lojas.md, seção iOS."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error title=Supabase ausente::Faltam as variáveis SUPABASE_URL e SUPABASE_ANON_KEY (Settings › Secrets and variables › Actions › Variables): o app sairia sem conta."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Versão = a do package.json (a mesma do Android); o número do build soma a rodada, para mandar mais de um
      # build da mesma versão ao TestFlight (CFBundleVersion 1000.7, 1000.8…)
      - name: versão (package.json)
        id: version
        run: |
          node scripts/app-version.mjs | tee version.json
          echo "name=$(node -p "require('./version.json').name.split('-')[0]")" >> "$GITHUB_OUTPUT"
          echo "build=$(node -p "require('./version.json').code").$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      # Keychain só deste job, com o certificado de distribuição; a chave .p8 da API vai para onde o altool procura
      - name: certificado e chave da API no runner
        env:
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_ASC_KEY_P8_BASE64: ${{ secrets.APPLE_ASC_KEY_P8_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          echo "$APPLE_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$APPLE_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/dist.p12"
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_$APPLE_ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$APPLE_ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      # Assinatura automática: o xcodebuild cria ou baixa o perfil de distribuição pela chave da API
      - name: xcodebuild archive
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$APPLE_ASC_KEY_ID" -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic
          MARKETING_VERSION="${{ steps.version.outputs.name }}" CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}"
          archive
      - name: exporta o ipa
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$APPLE_ASC_KEY_ID" -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID"
      - name: envia ao testflight
        run: xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/App.ipa" --apiKey "$APPLE_ASC_KEY_ID" --apiIssuer "$APPLE_ASC_ISSUER_ID"
      - name: apaga certificado e chave do runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/dist.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: violin-hero-ios-${{ steps.version.outputs.name }}-${{ steps.version.outputs.build }}
          path: ${{ runner.temp }}/export/App.ipa
          retention-days: 14
