name: CI

on:
  push:
    # Só main e as branches de ciclo; o resto roda pelo pull_request (sem isso cada job do PR roda 2×)
    branches: [main, 'task/ciclo-*']
  pull_request:
  # À mão, em qualquer branch: o único jeito de rodar os jobs do celular fora do push (ver android e ios)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

# Todo job repete o mesmo `if`: o PR de uma branch de ciclo já roda pelo push dela no mesmo SHA, então no
# pull_request dela os jobs ficam "skipped" (1 run por SHA). O `if` de job não lê `env`, por isso a repetição.
jobs:
  app:
    name: lint, typecheck, test, build
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'task/ciclo-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Regra do versionCode das lojas (a mesma do android/app/build.gradle)
      - run: node --test scripts/app-version.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/class-login/client-ip_test.ts
      - run: npm run build

  # Um Supabase local só para os dois: test:db (no db:local) e o e2e do catálogo contra o banco semeado
  catalogo:
    name: banco e e2e do catálogo (supabase local)
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'task/ciclo-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # O registro das imagens limita downloads anônimos (o job já caiu 1× nisso): as imagens ficam no cache do
      # Actions, pela versão do CLI (package-lock) e pelos serviços ligados (config.toml)
      - name: imagens do Supabase (cache)
        id: supabase-images
        uses: actions/cache@v4
        with:
          path: ~/supabase-images
          key: supabase-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'supabase/config.toml') }}
      - name: carrega as imagens do cache
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: docker load -i ~/supabase-images/images.tar
      # Sobe o Supabase (com o edge runtime, que serve a função import-song e baixa as dependências npm: dela na 1ª
      # chamada), migra, semeia o catálogo e roda o test:db e o test:functions; os containers ficam de pé para o e2e
      - run: npm run db:local
      - name: guarda as imagens para o próximo run
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/supabase-images
          docker ps -a --format '{{.Image}}' | sort -u | xargs docker save -o ~/supabase-images/images.tar
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:catalogo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-catalogo
          path: |
            playwright-report-catalogo
            test-results-catalogo
          retention-days: 7

  e2e:
    name: e2e (playwright)
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'task/ciclo-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # O relatório HTML abre o print e o trace no navegador; test-results guarda os arquivos crus (png, trace.zip)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # App de celular (Capacitor). Só no push (main e branches de ciclo) e à mão (workflow_dispatch): o runner de macOS
  # custa 10× o minuto do Ubuntu, e PR de tela não mexe no nativo; quebrou o nativo, a branch do ciclo ou a main acusa.
  # As variáveis do Supabase são as públicas do build da web (Actions › Variables); sem elas o app abre sem conta.
  android:
    name: android (apk de debug)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # O Capacitor 8 pede JDK 21; o SDK do Android já vem no runner
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: npm run android:debug
      - uses: actions/upload-artifact@v4
        with:
          name: violin-hero-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Prova que o iOS compila, sem assinatura: a conta da Apple Developer ainda não existe (sem certificado nem perfil)
  ios:
    name: ios (xcodebuild sem assinatura)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: xcodebuild
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
          build
