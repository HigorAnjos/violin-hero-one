name: Release Android

# AAB de release assinado com a chave de upload, para o Higor subir na Play (trilha de teste fechado, depois produção).
# Só à mão (Actions › Release Android › Run workflow) e na tag v* (git tag v0.1.0 && git push --tags). A chave nunca
# entra no repositório: vem dos 4 secrets abaixo, que o Higor cadastra (docs/lojas.md), e só existe no disco do runner
# enquanto o job roda. A Play reassina para os aparelhos (Play App Signing): esta é só a chave de upload.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '26'

jobs:
  aab:
    name: aab de release assinado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      # Primeiro passo: sem os secrets ou sem as variáveis do Supabase, para antes de gastar o build
      - name: confere secrets e variáveis
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Chave de upload ausente::Faltam os secrets ${missing[*]}. Gere a chave de upload e cadastre os 4 secrets em Settings › Secrets and variables › Actions, como está em docs/lojas.md (seção Android)."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error title=Supabase ausente::Faltam as variáveis SUPABASE_URL e SUPABASE_ANON_KEY (Settings › Secrets and variables › Actions › Variables): o app sairia sem conta."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # O Capacitor 8 pede JDK 21; o SDK do Android já vem no runner
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: versão (package.json)
        id: version
        run: |
          node scripts/app-version.mjs | tee version.json
          name=$(node -p "require('./version.json').name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require('./version.json').code")" >> "$GITHUB_OUTPUT"
          # Na tag, a tag e o package.json têm de concordar (v0.1.0 ↔ 0.1.0)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error title=Versão diferente::A tag $GITHUB_REF_NAME não bate com a versão $name do package.json."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: chave de upload no disco do runner
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: bundleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      # AAB sem assinatura (variável faltando no gradle) não passa daqui
      - name: confere a assinatura
        run: keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab
      - name: apaga a chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: violin-hero-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
