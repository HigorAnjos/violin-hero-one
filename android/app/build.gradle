apply plugin: 'com.android.application'

// Versão do app = "version" do package.json (a mesma do site). versionCode = major * 1.000.000 + minor * 1.000 + patch
// (0.1.0 → 1000, 1.2.3 → 1002003): sobe sempre que a versão sobe, e a Play recusa um AAB com versionCode que ela já
// viu. Cada envio à loja pede versão nova no package.json; minor e patch vão até 999. A mesma conta está em
// scripts/app-version.mjs (o build do iOS usa aquela).
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version as String
def appVersionParts = appVersion.tokenize('-')[0].tokenize('.').collect { it as int }
if (appVersionParts.size() != 3 || appVersionParts[1] > 999 || appVersionParts[2] > 999) {
    throw new GradleException("versão do package.json fora do formato x.y.z com y e z até 999: ${appVersion}")
}
def appVersionCode = appVersionParts[0] * 1000000 + appVersionParts[1] * 1000 + appVersionParts[2]

// Chave de upload da Play: só pelo ambiente (secrets da CI, ou a máquina do Higor), nunca no repositório. Sem as
// quatro variáveis, o bundleRelease sai sem assinatura (a CI confere antes e para com a mensagem do docs/lojas.md).
def uploadKeystore = System.getenv('ANDROID_KEYSTORE_PATH')
def uploadSigning = uploadKeystore && System.getenv('ANDROID_KEYSTORE_PASSWORD') && System.getenv('ANDROID_KEY_ALIAS') && System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace = "app.violinhero"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.violinhero"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadSigning) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (uploadSigning) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
