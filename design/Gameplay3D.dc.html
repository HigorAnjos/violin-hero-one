<script type="text/x-dc" data-dc-script data-props='{"cents":{"editor":"range","default":6,"min":-50,"max":50,"step":1,"unit":"¢"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const c = Math.max(-50, Math.min(50, Number(this.props.cents ?? 6)));
    const abs = Math.abs(c);
    return {
      hz: (590.0 * Math.pow(2, c / 1200)).toFixed(1).replace('.', ','),
      centsLabel: (c > 0 ? '+' : (c < 0 ? '−' : '')) + abs + ' ¢',
      status: abs <= 15 ? 'AFINADO' : (c > 0 ? 'ALTO ▴' : 'BAIXO ▾'),
      statusColor: abs <= 15 ? '#1f2a44' : (abs <= 30 ? '#0b8fa8' : '#b87800'),
      needleLeft: (50 + c) + '%'
    };
  }
}
</script>
