<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Violin Hero — Contagem</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/violinhero/tokens.css">
<link rel="stylesheet" href="ds/violinhero/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#fbf6ea}
a{color:#0b8fa8}a:hover{color:#1f2a44}
.vh-beat{animation:vhbeat .536s ease-out infinite}
@keyframes vhbeat{0%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.vh-beat{animation:none}}
</style>
</helmet>
<div class="ns-screen ns-anim" style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #fbf6ea; color: #1f2a44; font-family: 'Nunito', system-ui, sans-serif">

  <div aria-hidden="true" style="position: absolute; inset: 0">
    <div style="position: absolute; left: 0; top: 330px; opacity: 0.55">
      <dc-import name="Orchestra" strip-width="1280" energy="4" maestro="{{ true }}" notes="{{ false }}" hint-size="1280px,330px"></dc-import>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 420px; background: rgba(251, 246, 234, 0.85)"></div>
  </div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
    <span class="ns-label">Canon em Neon · Arcade · Médio</span>
    <span class="vh-beat" role="timer" aria-label="Começa em 3" style="font-family: 'Baloo 2', sans-serif; font-size: 220px; line-height: 0.9; color: #1f2a44; text-shadow: none">3</span>
    <div style="display: flex; gap: 18px" aria-label="Compasso de entrada: tempo 2 de 4">
      <i style="width: 20px; height: 20px; border-radius: 999px; background: #d63a8a; box-shadow: none"></i>
      <i style="width: 20px; height: 20px; border-radius: 999px; background: #d63a8a; box-shadow: none"></i>
      <i style="width: 20px; height: 20px; border-radius: 999px; border: 2px solid #e3d8bf; box-sizing: border-box"></i>
      <i style="width: 20px; height: 20px; border-radius: 999px; border: 2px solid #e3d8bf; box-sizing: border-box"></i>
    </div>
    <span style="font-family: 'Baloo 2', sans-serif; font-size: 26px; color: #0b8fa8; text-shadow: none">Levante o arco</span>
    <div class="ns-panel" style="display: flex; align-items: center; gap: 18px; padding: 14px 20px">
      <span class="ns-label">Primeira nota</span>
      <span style="font-family: 'Baloo 2', sans-serif; font-size: 28px; color: #d63a8a; text-shadow: none">Ré4</span>
      <span style="font-size: 15px; color: #1f2a44">corda Ré solta</span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #1f2a44"><svg width="20" height="14" viewBox="0 0 22 16" aria-hidden="true"><path d="M2 15V2h18v13" style="fill: none; stroke: #1f2a44; stroke-width: 3"></path></svg>para baixo</span>
    </div>
    <span style="font-family: 'Nunito', monospace; font-size: 14px; color: #5b6478">1 compasso de entrada · 112 BPM · latência 142 ms descontada</span>
    <a href="Gameplay.dc.html" style="font-size: 14px">Pular contagem ▸</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
