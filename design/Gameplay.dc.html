.gem{position:absolute;width:80px;height:28px;margin-left:-40px;border-radius:12px;border:2.5px solid #1f2a44;box-sizing:border-box}
.gem::after{content:"";position:absolute;left:12px;right:30px;top:5px;height:5px;border-radius:999px;background:#ffffff;opacity:.7}
.tail{position:absolute;width:16px;margin-left:-8px;border-radius:8px;opacity:.5}
.tgt{width:70px;height:70px;box-sizing:border-box;border-radius:999px;background:#ffffff;border:5px solid}
.card{background:#ffffff;border:2px solid #e3d8bf;border-radius:16px;box-shadow:0 3px 0 #e3d8bf}
.lbl{font:800 12px/16px 'Nunito',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5b6478}
